<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spare filming — tracking screen</title>
  <style>
    :root { background: #888; color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { cursor: none; }
    .mark { position: fixed; width: clamp(28px, 4vmin, 64px); height: clamp(28px, 4vmin, 64px); }
    .mark::before, .mark::after { content: ""; position: absolute; background: #111; }
    .mark::before { inset: 0 40%; }
    .mark::after { inset: 40% 0; }
    .tl { left: 6%; top: 8%; }
    .tr { right: 6%; top: 8%; }
    .bl { left: 6%; bottom: 8%; }
    .br { right: 6%; bottom: 8%; }
    button { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 18px 26px; font: 600 18px system-ui, sans-serif; border: 0; border-radius: 10px; background: #fff; color: #111; cursor: pointer; }
    button small { display: block; margin-top: 8px; font-size: 13px; font-weight: 400; }
    body.ready button { display: none; }
  </style>
</head>
<body>
  <div class="mark tl" aria-hidden="true"></div>
  <div class="mark tr" aria-hidden="true"></div>
  <div class="mark bl" aria-hidden="true"></div>
  <div class="mark br" aria-hidden="true"></div>
  <button id="start">Start full screen<small>If needed, press F11. Press Esc to finish.</small></button>
  <script>
    const start = document.getElementById('start');
    start.addEventListener('click', async () => {
      document.body.classList.add('ready');
      try { await document.documentElement.requestFullscreen(); }
      catch { /* F11 still works when the browser disallows fullscreen. */ }
    });
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) document.body.classList.remove('ready');
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') document.body.classList.remove('ready');
      if (event.key === 'F11') document.body.classList.add('ready');
    });
  </script>
</body>
</html>
